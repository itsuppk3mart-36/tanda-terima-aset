<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanda Terima Aset K3Mart</title>
<meta name="description" content="Form serah terima, pengiriman, dan pengembalian aset IT K3Mart">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,500..900;1,62..125,500..900&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}

:root{
  --ground:#F1F6F6; --surface:#FFFFFF; --surface-2:#E6EFEF; --ink:#0F2526; --muted:#566B6B; --faint:#869898;
  --line:#D3E0DF; --line-strong:#B3C7C6;
  --k3:#1B7C79; --k3-deep:#115E5C; --k3-soft:#DAF0EF; --on-k3:#FFFFFF;
  --brand:#31A4A1; --mint:#7BCBC8; --pink:#EE5BA2; --yellow:#FFCA08;
  --warn:#8A5A00; --warn-soft:#FFF1BF; --danger:#B03A2E; --danger-soft:#F7E0DC;
  --shadow:0 1px 2px rgba(20,40,28,.06),0 8px 24px -12px rgba(20,40,28,.18);
  --doc-paper:#FFFFFF; --doc-ink:#0F1F20; --doc-muted:#51625F; --doc-line:#C6D3D2; --doc-k3:#1B7C79;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0B1616; --surface:#112020; --surface-2:#172A2A; --ink:#E1EEED; --muted:#93AAA9; --faint:#667D7C;
    --line:#223636; --line-strong:#304848;
    --k3:#5CC6C2; --k3-deep:#8ADBD8; --k3-soft:#133636; --on-k3:#052120;
    --warn:#FFD34D; --warn-soft:#3A2F08; --danger:#EE8A7E; --danger-soft:#3D1C18;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#0B1616; --surface:#112020; --surface-2:#172A2A; --ink:#E1EEED; --muted:#93AAA9; --faint:#667D7C;
  --line:#223636; --line-strong:#304848;
  --k3:#5CC6C2; --k3-deep:#8ADBD8; --k3-soft:#133636; --on-k3:#052120;
  --warn:#FFD34D; --warn-soft:#3A2F08; --danger:#EE8A7E; --danger-soft:#3D1C18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding:0 16px 96px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--k3);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;gap:14px;padding-block:18px 14px;flex-wrap:wrap}
.topline{width:120px;margin-bottom:0}
.toprule{border-bottom:1px solid var(--line);display:flex}
.logo{width:44px;height:44px;border-radius:9px;display:block;flex:none;max-width:100%}
.stripes{display:flex;gap:3px;height:100%}
.tri{height:4px;background:linear-gradient(90deg,var(--mint) 0 33.33%,var(--pink) 33.33% 66.66%,var(--yellow) 66.66%)}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 220px}
.brand h1{margin:0;font-family:var(--f-display);font-style:italic;font-stretch:88%;font-weight:900;font-size:24px;line-height:1.05;letter-spacing:-.01em;text-transform:uppercase}
.brand small{color:var(--muted);font-size:12.5px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--surface)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.on i{background:var(--k3)}
.sync.local i{background:var(--warn)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--k3)}
.btn.primary{background:var(--k3);border-color:var(--k3);color:var(--on-k3)}
.btn.primary:hover{background:var(--k3-deep);border-color:var(--k3-deep)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--danger);border-color:var(--line)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:17px;height:17px;flex:none}

/* list view */
.bar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:22px 14px;flex-wrap:wrap}
.bar h2{margin:0;font-family:var(--f-display);font-style:italic;font-stretch:90%;font-weight:850;font-size:28px;line-height:1.1;text-wrap:balance}
.bar p{margin:4px 0 0;color:var(--muted);font-size:14px}
.tally{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;margin-bottom:16px}
.tally div{flex:1;padding:12px 14px;border-left:1px solid var(--line);min-width:0}
.tally div:first-child{border-left:0}
.tally b{display:block;font-family:var(--f-display);font-stretch:80%;font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tally span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tally .warn b{color:var(--warn)}
.tally .warn{box-shadow:inset 0 3px 0 var(--yellow)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:0 12px}
.search input{border:0;background:transparent;padding:10px 0;width:100%;outline:none}
.search svg{width:17px;height:17px;color:var(--faint);flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.6fr) auto auto;gap:14px;align-items:center;padding:13px 16px;border-top:1px solid var(--line);text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row .no{font-family:var(--f-mono);font-size:13px;font-weight:600;overflow-wrap:anywhere}
.row .date{font-size:12.5px;color:var(--muted)}
.row .who{font-weight:600;overflow-wrap:anywhere}
.row .what{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .n{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);text-align:right}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid var(--line-strong);color:var(--muted);margin-right:6px;vertical-align:1px}
.tag.ex{border-style:dashed}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--k3-soft);color:var(--k3-deep)}
.pill.wait{background:var(--warn-soft);color:var(--warn)}
.pill.late{background:var(--danger-soft);color:var(--danger)}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.notice{font-size:13px;color:var(--muted);padding:10px 14px;border:1px dashed var(--line-strong);border-radius:8px;margin-bottom:14px}

/* form */
.form{max-width:780px;padding-block:8px 20px}
.sec{border-top:1px solid var(--line);padding-block:22px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px}
.sec:first-of-type{border-top:0}
.sec-h{display:flex;flex-direction:column;gap:2px}
.sec-h .num{font-family:var(--f-mono);font-size:12px;color:var(--k3);font-weight:600}
.sec-h h3{font-style:italic}
.sec-h h3{margin:0;font-family:var(--f-display);font-stretch:82%;font-weight:700;font-size:18px;line-height:1.15;text-transform:uppercase;letter-spacing:.01em}
.sec-h p{margin:4px 0 0;color:var(--muted);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.grid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field label em{font-style:normal;color:var(--danger)}
.in{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:9px 11px;min-height:40px}
.in:focus{border-color:var(--k3);outline:none;box-shadow:0 0 0 3px var(--k3-soft)}
textarea.in{min-height:72px;resize:vertical}
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.type{position:relative;border:1.5px solid var(--line-strong);border-radius:var(--r);background:var(--surface);padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.type svg{width:26px;height:26px;color:var(--muted)}
.type .tx{display:flex;flex-direction:column;gap:4px;min-width:0}
.type b{font-size:14px;line-height:1.25}
.type span{font-size:12px;color:var(--muted);line-height:1.35}
.type .code{position:absolute;top:10px;right:10px;font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.type[aria-checked="true"]{border-color:var(--k3);background:var(--k3-soft);box-shadow:inset 0 -4px 0 var(--brand)}
.type[aria-checked="true"] svg{color:var(--k3)}
.party{display:flex;flex-direction:column;gap:12px}
.party + .party{margin-top:18px;padding-top:18px;border-top:1px dashed var(--line)}
.party h4{margin:0;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:baseline}
.party h4 small{font-weight:500;color:var(--muted)}
.items{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px;display:grid;grid-template-columns:28px repeat(6,minmax(0,1fr));gap:10px;align-items:end}
.item .idx{font-family:var(--f-mono);font-size:13px;color:var(--faint);align-self:start;padding-top:22px}
.item .c2{grid-column:span 2}.item .c3{grid-column:span 3}.item .c1{grid-column:span 1}
.item .rm{grid-column:2/-1;justify-self:end;margin-top:-4px}
.photos{display:flex;gap:10px;flex-wrap:wrap}
.ph{position:relative;width:104px;height:104px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1}
.addph{width:104px;height:104px;border:1.5px dashed var(--line-strong);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:12px;font-weight:600;background:transparent}
.addph svg{width:24px;height:24px}
.sigs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sigbox{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:8px}
.sigbox .lbl{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sigslot{height:96px;border:1.5px dashed var(--line-strong);border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:13px;font-weight:600;background:transparent;width:100%}
.sigslot.has{border-style:solid;background:#fff}
.sigslot img{max-height:84px;max-width:100%}
.sigbox .nm{font-size:13px;font-weight:600;min-height:1.2em}
.formbar{position:sticky;bottom:0;background:linear-gradient(to top,var(--ground) 70%,transparent);padding-block:18px 14px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;z-index:5}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600;margin-top:10px}

/* detail + document */
.dbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-block:18px 16px}
.dbar .sp{flex:1}
.sheetwrap{overflow-x:auto;padding-bottom:10px}
.sheet{background:var(--doc-paper);color:var(--doc-ink);max-width:794px;margin:0 auto;padding:44px 48px 52px;box-shadow:var(--shadow);border-radius:2px;position:relative;font-size:13px;line-height:1.55}
.kop{display:flex;align-items:center;gap:14px;padding-bottom:12px;border-bottom:2px solid var(--doc-ink);position:relative}
.kop::after{content:"";position:absolute;left:0;width:132px;bottom:-7px;height:5px;background:linear-gradient(90deg,#7BCBC8 0 33.33%,#EE5BA2 33.33% 66.66%,#FFCA08 66.66%)}
.kop .logo{width:56px;height:56px;border-radius:8px}
.kop .co b{display:block;font-family:var(--f-display);font-style:italic;font-stretch:88%;font-size:19px;font-weight:900;letter-spacing:.01em;text-transform:uppercase;line-height:1.1}
.kop .co span{font-size:11.5px;color:var(--doc-muted)}
.kop .co{display:flex;flex-direction:column}
.dtitle{text-align:center;margin:26px 0 4px}
.dtitle h2{margin:0;font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:18px;letter-spacing:.06em;text-transform:uppercase;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}
.dtitle .dno{font-family:var(--f-mono);font-size:12.5px;margin-top:6px}
.sheet p{margin:14px 0}
.kv{display:grid;grid-template-columns:130px 10px minmax(0,1fr);gap:2px 4px;margin:6px 0 0 18px}
.kv dt{color:var(--doc-ink)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.kv .c{text-align:center}
.plabel{font-weight:700;margin-top:14px}
.plabel small{font-weight:400;color:var(--doc-muted)}
table.at{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
table.at th,table.at td{border:1px solid var(--doc-line);padding:6px 7px;vertical-align:top;text-align:left}
table.at th{background:#EEF6F6;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
table.at td.num,table.at th.num{text-align:center;font-variant-numeric:tabular-nums}
table.at .sn{font-family:var(--f-mono);font-size:11.5px;overflow-wrap:anywhere}
.dphotos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.dphotos img{width:100%;aspect-ratio:4/3;object-fit:cover;border:1px solid var(--doc-line);display:block;max-width:100%}
.dsig{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:26px;text-align:center}
.dsig .role{font-size:12.5px}
.dsig .space{height:92px;display:flex;align-items:center;justify-content:center;position:relative}
.dsig .space img{max-height:88px;max-width:100%}
.dsig .name{font-weight:700;border-top:1px solid var(--doc-ink);padding-top:4px;display:inline-block;min-width:70%}
.dsig .sub{font-size:11.5px;color:var(--doc-muted)}
.signhere{border:1.5px dashed #8CC3C1;color:#1B7C79;background:#F0F9F9;border-radius:8px;padding:10px 12px;font-weight:700;font-size:12.5px;font-family:var(--f-body)}
.dsig>div{position:relative}
.stamp{position:absolute;right:-8px;top:22px;z-index:1;transform:rotate(-11deg);border:3px solid rgba(27,124,121,.82);color:rgba(27,124,121,.88);border-radius:6px;padding:5px 14px 4px;text-align:center;font-family:var(--f-display);font-stretch:75%;line-height:1;pointer-events:none;mix-blend-mode:multiply}
.stamp b{display:block;font-size:26px;font-weight:800;letter-spacing:.12em}
.stamp span{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;margin-top:3px;border-top:1.5px solid currentColor;padding-top:3px}
.dfoot{margin-top:30px;padding-top:8px;border-top:1px solid var(--doc-line);font-size:10.5px;color:var(--doc-muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lock{font-size:12.5px;color:var(--muted)}

/* signature sheet */
.overlay{position:fixed;inset:0;background:rgba(8,16,11,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0 12px}
.pad{background:var(--surface);width:100%;max-width:640px;border-radius:14px 14px 0 0;padding:18px 16px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.pad h3{margin:0;font-family:var(--f-display);font-style:italic;font-stretch:88%;font-weight:700;font-size:19px;text-transform:uppercase}
.pad p{margin:0;color:var(--muted);font-size:13px}
.canvaswrap{position:relative;border:1px solid var(--line-strong);border-radius:10px;background:#fff;height:220px;overflow:hidden;touch-action:none}
.canvaswrap canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.canvaswrap .baseline{position:absolute;left:24px;right:24px;bottom:52px;border-bottom:1px solid #C9D0C8;pointer-events:none}
.canvaswrap .x{position:absolute;left:14px;bottom:56px;color:#9AA59D;font-size:16px;pointer-events:none}
.padbar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.padbar .sp{flex:1}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.err{background:var(--danger);color:#fff}
.fab{display:none}

.topchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sync.bk{cursor:pointer;font-weight:600}
.sync.bk:hover{border-color:var(--k3)}
.sync.local{color:var(--warn)}
.bkpad{max-height:90vh;overflow-y:auto;gap:14px}
.bkhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bkstat{margin:0;color:var(--muted);font-size:13.5px}
.bkstat b{color:var(--ink)}
.bkgroup{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.bkgroup h4{margin:0;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.bkopt{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.bkopt .grow{flex:1 1 260px;display:flex;flex-direction:column;gap:2px;min-width:0}
.bkopt small,.snap small,.bkconfirm small{color:var(--muted);font-size:12.5px;line-height:1.45}
.bkrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.folder{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;color:var(--k3)}
.snaps{border:1px solid var(--line);border-radius:8px;max-height:230px;overflow-y:auto}
.snap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.snap:first-child{border-top:0}
.snap > div{display:flex;flex-direction:column;min-width:0}
.snap b{font-size:12.5px}
.bkconfirm{border:1.5px solid var(--k3);background:var(--k3-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
@media (max-width:760px){
  .sec{grid-template-columns:1fr;gap:12px}
  .row{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
  .row .c-who{grid-column:1/-1;order:3}
  .row .n{display:none}
  .types{grid-template-columns:1fr}
  .type{flex-direction:row;align-items:center;gap:12px}
  .type .tx{display:flex;flex-direction:column}
  .item{grid-template-columns:repeat(2,minmax(0,1fr))}
  .item .idx{grid-column:1/-1;padding-top:0}

}

  .grid{grid-template-columns:1fr}
  .sigs{grid-template-columns:1fr}

  .dsig{gap:16px}
  .stamp{right:-6px;top:30px}
  .stamp b{font-size:20px}
  .dphotos{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  @page{size:A4;margin:12mm}

  .top,.dbar,.no-print,.fab,.toast,.overlay{display:none!important}
  .sheet{box-shadow:none;max-width:none;padding:0}
  .sheetwrap{overflow:visible}
}

const $ = (s,el=document)=>el.querySelector(s);
const esc = v => String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO = ()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const parseISO = s=>{const [y,m,d]=(s||todayISO()).split("-").map(Number);return new Date(y,m-1,d)};
const tglPanjang = s=>{const d=parseISO(s);return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`};
const tglPendek = s=>{const d=parseISO(s);return `${d.getDate()} ${BULAN[d.getMonth()].slice(0,3)} ${d.getFullYear()}`};
const uid = ()=>"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmtRp = v=>{ const n=String(v==null?"":v).replace(/[^\d]/g,""); return n?"Rp "+Number(n).toLocaleString("id-ID"):""; };
const telat = r=> r.jenis==="eksternal" && r.eks && r.eks.kembaliPada && r.eks.kembaliPada < todayISO();

function normDraft(d){ d.toko=d.toko||{kode:"",nama:"",alamat:""}; d.kirim=d.kirim||{ekspedisi:"",resi:""}; d.eks=Object.assign(blankEks(),d.eks||{}); d.photos=d.photos||[]; d.ttd=d.ttd||{p1:"",p2:""}; d.items=d.items&&d.items.length?d.items:[newItem()]; return d; }
const statusOf = r=> (r.ttd && r.ttd.p1 && r.ttd.p2) ? "selesai" : "menunggu";

async function saveFile(filename,data){
  if(Store.downloads) return Store.downloads.save({filename,data});
  const blob = data instanceof Blob ? data : new Blob([data],{type:filename.endsWith(".csv")?"text/csv;charset=utf-8":filename.endsWith(".json")?"application/json":"application/octet-stream"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
}
const photoSrc = p=> p.asset ? "/_blob/"+p.asset : (p.src||"");
function lsGet(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
let toastT;
function toast(msg,err){const l=$("#toastEl");if(l)l.remove();const t=document.createElement("div");t.id="toastEl";t.className="toast"+(err?" err":"");t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),3200)}

/* ---------- store ---------- */
const Store = {
  mode:"init", db:null, assets:null, downloads:null, unsub:null, listeners:[],
  async init(){
    const c = window.claude;
    if(c && typeof c.use==="function"){
      const [db,assets,downloads] = await Promise.all([c.use("db").catch(()=>null),c.use("assets").catch(()=>null),c.use("downloads").catch(()=>null)]);
      this.db=db; this.assets=assets; this.downloads=downloads;
    }
    this.mode = this.db ? "db" : "local";
    setSync();
    if(this.db){
      this.unsub = this.db.collection("receipts").orderBy("createdAt","desc").limit(1000).onSnapshot(
        snap=>{ S.records = snap.docs.map(d=>Object.assign({},d.data(),{id:d.id})); S.loaded=true; onData(); },
        err=>{ toast("Koneksi data terputus: "+(err&&err.message||"coba muat ulang"),true); }
      );
    } else {
      S.records = lsGet(LS_KEY,[]); S.loaded=true; onData();
    }
  },
  async save(rec){
    Backup.reason="Simpan "+(rec.no||"");
    const clean = JSON.parse(JSON.stringify(rec)); delete clean.id;
    if(this.mode==="db"){ await this.db.doc("receipts/"+rec.id).set(clean); }
    else { const all=lsGet(LS_KEY,[]).filter(r=>r.id!==rec.id); all.unshift(Object.assign({},clean,{id:rec.id})); all.sort((a,b)=>b.createdAt-a.createdAt); if(!lsSet(LS_KEY,all)) throw new Error("Penyimpanan browser penuh"); S.records=all; onData(); }
  },
  async replaceAll(records){
    const clean=records.map(r=>Object.assign({},r)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    if(this.mode==="db"){
      const keep=new Set(clean.map(r=>r.id));
      for(const r of clean){ const d=Object.assign({},r); delete d.id; await this.db.doc("receipts/"+r.id).set(d); }
      for(const r of S.records.slice()) if(!keep.has(r.id)) await this.db.doc("receipts/"+r.id).delete();
    } else { if(!lsSet(LS_KEY,clean)) throw new Error("Penyimpanan browser penuh — hapus beberapa foto atau dokumen lama"); S.records=clean; onData(); }
  },
  async remove(rec){
    Backup.reason="Hapus "+(rec.no||"");
    if(this.mode==="db"){
      await this.db.doc("receipts/"+rec.id).delete();
      if(this.assets) for(const p of (rec.photos||[])) if(p.asset) this.assets.delete(p.asset).catch(()=>{});
    } else { const all=lsGet(LS_KEY,[]).filter(r=>r.id!==rec.id); lsSet(LS_KEY,all); S.records=all; onData(); }
  },
  async addPhoto(file){
    if(this.assets){
      const blob = await compress(file,1400,.74,"blob");
      const res = await this.assets.upload(blob,{type:"image/jpeg"});
      return {asset:res.id};
    }
    return {src: await compress(file,760,.6,"dataurl")};
  }
};
function setSync(){
  const el=$("#sync"); if(!el) return;
  el.className="sync "+(Store.mode==="db"?"on":Store.mode==="local"?"local":"");

function compress(file,max,q,kind){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{ let {width:w,height:h}=img; const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h; const cx=cv.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,w,h); cx.drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
      if(kind==="blob") cv.toBlob(b=>b?res(b):rej(new Error("Gagal memproses foto")),"image/jpeg",q); else res(cv.toDataURL("image/jpeg",q)); };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("File bukan gambar yang bisa dibaca"))};
    img.src=url;
  });
}

function validate(d){
  if(!d.tanggal) return ["tanggal","Isi tanggal dokumen."];
  if(isExt(d.jenis) && d.eks.tipe!=="Perorangan / tamu" && !d.eks.perusahaan.trim()) return ["eks_perusahaan","Isi nama perusahaan / instansi pihak eksternal."];
  if(d.jenis==="toko"){ if(!d.toko.kode.trim()) return ["toko_kode","Isi kode toko tujuan."]; if(!d.toko.nama.trim()) return ["toko_nama","Isi nama toko tujuan."]; }
  if(!d.p1.nama.trim()) return ["p1_nama",`Isi nama ${JENIS[d.jenis].p1.toLowerCase()}.`];
  if(!d.p2.nama.trim()) return ["p2_nama",`Isi nama ${JENIS[d.jenis].p2.toLowerCase()}.`];
  const bad=d.items.findIndex(i=>!String(i.nama).trim());
  if(bad>-1) return [`it${bad}_nama`,`Isi merk / tipe untuk aset baris ${bad+1}.`];
  return null;
}

      catatan:d.catatan, photos:d.photos, ttd:d.ttd, createdAt:d.createdAt||now, updatedAt:now, contoh:!!d.contoh
    };
    if(d.id && d._hadSig && d._dirty){ rec.ttd={p1:d._sigTouched&&d._sigTouched.p1?d.ttd.p1:"",p2:d._sigTouched&&d._sigTouched.p2?d.ttd.p2:""}; }
    rec.ttdAt = rec.ttd.p1&&rec.ttd.p2 ? (d.ttdAt && !d._dirty ? d.ttdAt : now) : null;

}

/* ---------- signature pad ---------- */
function openPad(title,name,onSave){
  const layer=$("#layer");
  layer.innerHTML=`<div class="overlay" id="ov"><div class="pad" role="dialog" aria-modal="true" aria-labelledby="padT">
    <h3 id="padT">Tanda tangan · ${esc(title)}</h3><p>${name?esc(name)+" — ":""}tanda tangan di dalam kotak menggunakan jari atau mouse.</p>
    <div class="canvaswrap"><canvas id="cv"></canvas><span class="x">×</span><span class="baseline"></span></div>
    <div class="padbar"><button class="btn ghost" id="padClear">Hapus coretan</button><span class="sp"></span><button class="btn" id="padCancel">Batal</button><button class="btn primary" id="padOk" disabled>Simpan tanda tangan</button></div>
  </div></div>`;
  const cv=$("#cv"), wrap=cv.parentElement, dpr=Math.min(2,window.devicePixelRatio||1);
  const W=wrap.clientWidth, H=wrap.clientHeight; cv.width=W*dpr; cv.height=H*dpr;
  const cx=cv.getContext("2d"); cx.scale(dpr,dpr); cx.lineCap="round"; cx.lineJoin="round"; cx.strokeStyle="#0E1F5C";
  let drawing=false, last=null, dirty=false, minX=1e9,minY=1e9,maxX=-1,maxY=-1;
  const pt=e=>{const b=cv.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top,p:e.pressure&&e.pointerType==="pen"?e.pressure:.5}};
  cv.addEventListener("pointerdown",e=>{drawing=true;cv.setPointerCapture(e.pointerId);last=pt(e);cx.beginPath();cx.arc(last.x,last.y,1.1,0,Math.PI*2);cx.fillStyle="#0E1F5C";cx.fill();});
  cv.addEventListener("pointermove",e=>{ if(!drawing) return; const p=pt(e); const dist=Math.hypot(p.x-last.x,p.y-last.y); cx.lineWidth=Math.max(1.4,3.2-dist*0.08); cx.beginPath();cx.moveTo(last.x,last.y);cx.lineTo(p.x,p.y);cx.stroke();
    minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y); last=p; if(!dirty){dirty=true;$("#padOk").disabled=false} });
  const end=()=>{drawing=false};
  cv.addEventListener("pointerup",end); cv.addEventListener("pointercancel",end);
  const close=()=>{layer.innerHTML=""};
  $("#padClear").onclick=()=>{cx.clearRect(0,0,W,H);dirty=false;minX=minY=1e9;maxX=maxY=-1;$("#padOk").disabled=true};
  $("#padCancel").onclick=close;
  $("#ov").addEventListener("click",e=>{if(e.target.id==="ov")close()});
  document.addEventListener("keydown",function k(e){if(e.key==="Escape"){close();document.removeEventListener("keydown",k)}});
  $("#padOk").onclick=()=>{
    const pad=8, sx=Math.max(0,minX-pad), sy=Math.max(0,minY-pad), sw=Math.min(W,maxX+pad)-sx, sh=Math.min(H,maxY+pad)-sy;
    const out=document.createElement("canvas"), k=Math.min(1,480/(sw*dpr)); out.width=Math.max(1,Math.round(sw*dpr*k)); out.height=Math.max(1,Math.round(sh*dpr*k));
    out.getContext("2d").drawImage(cv,sx*dpr,sy*dpr,sw*dpr,sh*dpr,0,0,out.width,out.height);
    onSave(out.toDataURL("image/png")); close();
  };
}

function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("Gagal memuat pustaka PDF"));document.head.appendChild(s)})}
async function makePDF(r){

    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");

    const host=document.createElement("div"); host.style.cssText="position:fixed;left:-10000px;top:0;width:794px;";

    await Promise.all([...sheet.querySelectorAll("img")].map(im=>im.complete?0:new Promise(z=>{im.onload=im.onerror=z})));
    if(document.fonts&&document.fonts.ready) await document.fonts.ready;

    const pw=210, ph=297, iw=pw, ih=canvas.height*pw/canvas.width, img=canvas.toDataURL("image/jpeg",.92);
    let y=0; pdf.addImage(img,"JPEG",0,y,iw,ih); let left=ih-ph;
    while(left>0){ y-=ph; pdf.addPage(); pdf.addImage(img,"JPEG",0,y,iw,ih); left-=ph; }
    const blob=pdf.output("blob");
    await saveFile("Tanda-Terima-"+r.no.replace(/[\/]/g,"-")+".pdf",blob);

  finally{ const b=$("#pdfBtn"); if(b){b.disabled=false;b.lastChild.textContent="Unduh PDF"} }
}

/* ---------- autobackup ---------- */
const LS_BK = "k3_tta_backup_meta_v1";
const FOLDER_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" width="18" height="18"><path d="M3.5 6.5h6l2 2h9v10h-17z"/></svg>';
const IDB = { db:null,
  open(){ if(this.db) return Promise.resolve(this.db);
    return new Promise((res,rej)=>{ let rq; try{ rq=indexedDB.open("k3_tta_backup",1); }catch(e){ return rej(e); }
      rq.onupgradeneeded=()=>{ const d=rq.result; d.createObjectStore("kv"); d.createObjectStore("snaps",{keyPath:"id",autoIncrement:true}); d.createObjectStore("snapdata"); };
      rq.onsuccess=()=>{ this.db=rq.result; res(this.db); }; rq.onerror=()=>rej(rq.error); }); },
  req(store,mode,op){ return this.open().then(d=>new Promise((res,rej)=>{ const t=d.transaction(store,mode); const r=op(t.objectStore(store)); t.oncomplete=()=>res(r&&r.result); t.onerror=t.onabort=()=>rej(t.error); })); }
};
const fmtWaktu = ts=>{ const d=new Date(ts); return `${d.getDate()} ${BULAN[d.getMonth()].slice(0,3)} ${d.getFullYear()}, ${String(d.getHours()).padStart(2,"0")}.${String(d.getMinutes()).padStart(2,"0")}`; };
const jamSaja = ts=>{ const d=new Date(ts); return `${String(d.getHours()).padStart(2,"0")}.${String(d.getMinutes()).padStart(2,"0")}`; };

const Backup = {
  fsSupported: typeof window.showDirectoryPicker==="function" && (function(){ try{ return window.self===window.top; }catch(e){ return false; } })(),
  idbOk:true, dir:null, perm:"none", asked:false, timer:null, reason:"", inited:null, busy:false,
  meta:{ lastAt:0, lastSig:"", lastDlAt:0, lastDlSig:"", lastErr:"", mode:"harian" },
  init(){
    this.meta = Object.assign(this.meta, lsGet(LS_BK,{}));
    this.reason="Aplikasi dibuka";
    this.inited = (async()=>{
      try{ await IDB.open(); }catch(e){ this.idbOk=false; }
      if(this.fsSupported && this.idbOk){
        try{ this.dir = await IDB.req("kv","readonly",s=>s.get("dir")) || null;
             if(this.dir) this.perm = await this.dir.queryPermission({mode:"readwrite"}); }catch(e){ this.dir=null; }
      }
      renderChip();
    })();
    return this.inited;
  },
  saveMeta(){ lsSet(LS_BK,this.meta); },
  sig(){ const s=S.records.map(r=>r.id+":"+(r.updatedAt||r.createdAt||0)).join("|"); let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return S.records.length+"-"+(h>>>0).toString(36); },
  payload(){ return JSON.stringify({app:"k3-tanda-terima-aset",format:1,exportedAt:new Date().toISOString(),count:S.records.length,petugas:petugas(),records:S.records}); },
  fileName(){ const d=new Date(); return `k3-tta-backup-${todayISO()}-${String(d.getHours()).padStart(2,"0")}${String(d.getMinutes()).padStart(2,"0")}.json`; },
  changed(){ clearTimeout(this.timer); this.timer=setTimeout(()=>this.run(),2000); },
  regrant(){ if(this.dir && this.perm==="prompt" && !this.asked){ this.asked=true; try{ this.dir.requestPermission({mode:"readwrite"}).then(p=>{ this.perm=p; renderChip(); if(p==="granted") this.run(); }).catch(()=>{}); }catch(e){} } },
  async run(opts){
    opts=opts||{};
    await this.inited; if(!S.loaded || this.busy) return; this.busy=true;
    const reason=opts.reason||this.reason||"Pembaruan data"; this.reason="";
    try{
      const sig=this.sig(), text=this.payload();
      if(this.idbOk){ try{ await this.snapshot(reason,text,sig,opts.forceSnap); }catch(e){} }
      if(this.dir && this.perm==="granted"){
        if(opts.forceExt || sig!==this.meta.lastSig){
          try{ await this.writeFolder(text); this.meta.lastAt=Date.now(); this.meta.lastSig=sig; this.meta.lastErr=""; }
          catch(e){ try{ this.perm=await this.dir.queryPermission({mode:"readwrite"}); }catch(_){ this.perm="denied"; } this.meta.lastErr="Gagal menulis ke folder backup: "+(e&&e.message||e); }
        }
      } else if(!this.dir && this.meta.mode!=="off" && S.records.length){
        const gap=this.meta.mode==="mingguan"?7*864e5:864e5;
        if(opts.forceExt || (Date.now()-(this.meta.lastDlAt||0)>=gap && sig!==this.meta.lastDlSig)){
          try{ await saveFile(this.fileName(),text); this.meta.lastDlAt=Date.now(); this.meta.lastDlSig=sig; this.meta.lastAt=Date.now(); this.meta.lastSig=sig; this.meta.lastErr=""; }
          catch(e){ if(!(e&&e.code==="declined")) this.meta.lastErr="Unduhan backup gagal: "+(e&&e.message||""); }
        }
      }
      this.saveMeta();
    } finally { this.busy=false; renderChip(); if(Panel.open) Panel.render(); }
  },
  async snapshot(reason,text,sig,force){
    if(!S.records.length && !force) return;
    const metas=(await IDB.req("snaps","readonly",s=>s.getAll())).sort((a,b)=>b.at-a.at);
    if(!force && metas[0] && metas[0].sig===sig) return;
    const id=await IDB.req("snaps","readwrite",s=>s.add({at:Date.now(),reason,count:S.records.length,sig,size:text.length}));
    await IDB.req("snapdata","readwrite",s=>s.put(text,id));
    const all=[{id,at:Date.now()}].concat(metas);
    const keep=new Set(all.slice(0,20).map(m=>m.id)), days=new Set(), cutoff=Date.now()-14*864e5;
    for(const m of all){ const k=new Date(m.at).toDateString(); if(m.at>=cutoff && !days.has(k)){ days.add(k); keep.add(m.id); } }
    for(const m of metas) if(!keep.has(m.id)){ await IDB.req("snaps","readwrite",s=>s.delete(m.id)); await IDB.req("snapdata","readwrite",s=>s.delete(m.id)); }
  },
  async writeFolder(text){
    for(const name of ["k3-tta-backup-terbaru.json",`k3-tta-backup-${todayISO()}.json`]){
      const fh=await this.dir.getFileHandle(name,{create:true}); const w=await fh.createWritable(); await w.write(text); await w.close();
    }
  },
  async pick(){
    try{ const dir=await window.showDirectoryPicker({id:"k3tta",mode:"readwrite",startIn:"documents"});
      this.dir=dir; this.perm="granted"; await IDB.req("kv","readwrite",s=>s.put(dir,"dir"));
      toast("Backup otomatis ke folder “"+dir.name+"” aktif"); await this.run({reason:"Folder backup dipilih",forceExt:true});
    }catch(e){ if(e&&e.name!=="AbortError") toast("Folder tidak bisa dipakai: "+(e.message||e),true); }
  },
  async grant(){ if(!this.dir) return; try{ this.perm=await this.dir.requestPermission({mode:"readwrite"}); }catch(e){ this.perm="denied"; }
    renderChip(); if(this.perm==="granted"){ toast("Izin folder diberikan"); await this.run({forceExt:true}); } else Panel.render(); },
  async unlink(){ this.dir=null; this.perm="none"; try{ await IDB.req("kv","readwrite",s=>s.delete("dir")); }catch(e){} toast("Folder backup dilepas"); renderChip(); Panel.render(); },
  parse(text){
    let p; try{ p=JSON.parse(text); }catch(e){ throw new Error("File bukan JSON yang valid"); }
    const list = Array.isArray(p) ? p : (p && Array.isArray(p.records) ? p.records : null);
    if(!list) throw new Error("File ini bukan backup Tanda Terima Aset");
    const records=list.filter(r=>r && r.id && r.no && JENIS[r.jenis] && Array.isArray(r.items));
    if(!records.length) throw new Error("Tidak ada dokumen yang bisa dipulihkan di file ini");
    return {records, skipped:list.length-records.length, exportedAt:p.exportedAt||"", petugas:p.petugas||null};
  },
  async restore(parsed,replace){
    await this.run({reason:"Sebelum pemulihan",forceSnap:true});
    let next;
    if(replace) next=parsed.records.slice();
    else { const map=new Map(S.records.map(r=>[r.id,r]));
      for(const r of parsed.records){ const cur=map.get(r.id); if(!cur || (r.updatedAt||0)>(cur.updatedAt||0)) map.set(r.id,r); }
      next=[...map.values()]; }
    if(parsed.petugas && parsed.petugas.nama && !petugas().nama) lsSet(LS_PETUGAS,parsed.petugas);
    this.reason = replace ? "Setelah pemulihan (ganti semua)" : "Setelah pemulihan (gabung)";
    await Store.replaceAll(next);
    return next.length;
  }
};
function renderChip(){
  const el=$("#bkChip"); if(!el) return;
  const B=Backup, m=B.meta; let cls="sync bk", txt;
  if(B.dir && B.perm==="granted") { cls+=" on"; txt = m.lastAt ? "Backup "+jamSaja(m.lastAt) : "Backup aktif"; }
  else if(B.dir) { cls+=" local"; txt="Izinkan backup"; }
  else if(m.mode!=="off") { cls+=" on"; txt = "Backup "+(m.mode==="mingguan"?"mingguan":"harian"); }
  else { cls+=" local"; txt="Backup nonaktif"; }
  if(m.lastErr){ cls="sync bk local"; txt="Backup gagal"; }
  el.className=cls; el.lastElementChild.textContent=txt;
}

/* ---------- backup panel ---------- */
const Panel = { open:false, pending:null, snaps:[],
  async show(){ this.open=true; this.pending=null; await this.render(); },
  close(){ this.open=false; this.pending=null; $("#layer").innerHTML=""; },
  async render(){
    if(!this.open) return;
    const B=Backup, m=B.meta;
    try{ this.snaps = B.idbOk ? (await IDB.req("snaps","readonly",s=>s.getAll())).sort((a,b)=>b.at-a.at) : []; }catch(e){ this.snaps=[]; }
    let status;
    if(m.lastErr) status=`<div class="warnbox" style="margin:0">${esc(m.lastErr)}</div>`;
    else if(B.dir && B.perm!=="granted") status=`<div class="warnbox" style="margin:0">Browser meminta izin ulang untuk menulis ke folder “${esc(B.dir.name)}”. Tekan <b>Izinkan lagi</b> — atau izin akan diminta otomatis saat Anda menyimpan dokumen.</div>`;
    else status=`<p class="bkstat">${m.lastAt?`Backup terakhir <b>${fmtWaktu(m.lastAt)}</b>${B.dir?` ke folder <b>${esc(B.dir.name)}</b>`:" (file unduhan)"}.`:"Belum ada file backup di luar browser."} ${S.records.length} dokumen tersimpan saat ini.</p>`;
    const folderBox = B.fsSupported ? `
      <div class="bkopt">
        <div class="grow"><b>Folder di komputer</b><small>Setiap perubahan otomatis disalin ke <span class="mono">k3-tta-backup-terbaru.json</span> + satu file per hari. Pilih folder yang tersinkron ke Google Drive / OneDrive agar ikut aman di cloud.</small></div>
        ${B.dir ? `<span class="folder">${FOLDER_SVG}${esc(B.dir.name)}</span>
          <div class="bkrow">${B.perm!=="granted"?`<button class="btn primary" data-act="bkGrant">Izinkan lagi</button>`:""}<button class="btn" data-act="bkPick">Ganti folder</button><button class="btn ghost" data-act="bkUnlink">Lepas</button></div>`
        : `<button class="btn primary" data-act="bkPick">${FOLDER_SVG}Pilih folder backup</button>`}
      </div>` : `<p class="bkstat" style="font-size:12.5px">Backup langsung ke folder hanya tersedia di Chrome/Edge versi komputer. Di perangkat ini backup dilakukan lewat file unduhan.</p>`;
    const dlBox = `
      <div class="bkopt">
        <div class="grow"><b>Unduh file backup otomatis</b><small>${B.dir?"Tidak dipakai selama backup ke folder aktif.":"File JSON diunduh otomatis saat aplikasi dibuka atau data berubah, sesuai jadwal."}</small></div>
        <select class="in" id="bkMode" style="width:auto" ${B.dir?"disabled":""}>
          <option value="harian"${m.mode==="harian"?" selected":""}>Setiap hari</option>
          <option value="mingguan"${m.mode==="mingguan"?" selected":""}>Setiap minggu</option>
          <option value="off"${m.mode==="off"?" selected":""}>Nonaktif</option>
        </select>
      </div>`;
    const snapList = !B.idbOk ? `<p class="bkstat">Salinan di browser tidak tersedia (mode privat / penyimpanan diblokir).</p>` :
      this.snaps.length ? `<div class="snaps">${this.snaps.map(s=>`<div class="snap"><div><b class="mono">${fmtWaktu(s.at)}</b><small>${esc(s.reason)} · ${s.count} dokumen</small></div><button class="btn ghost" data-act="bkSnap" data-id="${s.id}">Pulihkan</button></div>`).join("")}</div>`
      : `<p class="bkstat">Belum ada salinan. Salinan dibuat otomatis setiap data berubah.</p>`;
    const pending = this.pending ? `
      <div class="bkconfirm">
        <b>${esc(this.pending.name)}</b>
        <small>${this.pending.records.length} dokumen${this.pending.exportedAt?` · dibuat ${fmtWaktu(Date.parse(this.pending.exportedAt))}`:""}${this.pending.skipped?` · ${this.pending.skipped} baris tidak valid dilewati`:""}</small>
        <div class="bkrow"><button class="btn primary" data-act="bkMerge">Gabungkan</button><button class="btn danger" data-act="bkReplace">Ganti semua data</button><button class="btn ghost" data-act="bkCancelFile">Batal</button></div>
        <small><b>Gabungkan</b> menambah dokumen yang belum ada dan memperbarui yang versinya lebih baru. <b>Ganti semua</b> membuat data persis seperti file backup.</small>
      </div>` : "";
    $("#layer").innerHTML = `<div class="overlay" id="bkOv"><div class="pad bkpad" role="dialog" aria-modal="true" aria-labelledby="bkT">
      <div class="bkhead"><h3 id="bkT">Backup &amp; pemulihan</h3><button class="btn ghost" data-act="bkClose" aria-label="Tutup">Tutup</button></div>
      ${status}
      <section class="bkgroup"><h4>Backup otomatis</h4>${folderBox}${dlBox}</section>
      <section class="bkgroup"><h4>Salinan di browser ini</h4><p class="bkstat" style="font-size:12.5px">Dibuat otomatis setiap ada perubahan — 20 terakhir + satu per hari selama 14 hari. Untuk memulihkan dokumen yang terhapus tidak sengaja. Ikut hilang jika data browser dibersihkan.</p>${snapList}</section>
      <section class="bkgroup"><h4>Manual</h4>
        <div class="bkrow"><button class="btn" data-act="bkNow">${ICON.pdf}Unduh backup sekarang</button><label class="btn" for="bkFileIn">Pulihkan dari file…</label><input type="file" id="bkFileIn" accept=".json,application/json" hidden></div>
        ${pending}
      </section>
    </div></div>`;
  }
};

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act;
  if(a==="backup"){ Backup.regrant(); Panel.show(); return; }
  if(a==="bkClose"){ Panel.close(); return; }
  if(a==="bkPick"){ Backup.pick(); return; }
  if(a==="bkGrant"){ Backup.grant(); return; }
  if(a==="bkUnlink"){ Backup.unlink(); return; }
  if(a==="bkNow"){ if(!S.records.length){ toast("Belum ada dokumen untuk dibackup",true); return; } try{ await saveFile(Backup.fileName(),Backup.payload()); Backup.meta.lastDlAt=Date.now(); Backup.meta.lastAt=Date.now(); Backup.meta.lastErr=""; Backup.saveMeta(); renderChip(); Panel.render(); toast("File backup diunduh"); }catch(err){ if(!(err&&err.code==="declined")) toast("Backup gagal: "+(err&&err.message||""),true); } return; }
  if(a==="bkCancelFile"){ Panel.pending=null; Panel.render(); return; }
  if(a==="bkMerge"||a==="bkReplace"){
    if(a==="bkReplace" && !t.classList.contains("armed")){ t.classList.add("armed"); t.textContent="Yakin ganti semua?"; return; }
    const p=Panel.pending; if(!p) return;
    try{ const n=await Backup.restore(p,a==="bkReplace"); Panel.pending=null; toast("Dipulihkan — "+n+" dokumen"); Panel.render(); }catch(err){ toast("Pemulihan gagal: "+(err&&err.message||""),true); }
    return; }
  if(a==="bkSnap"){
    if(!t.classList.contains("armed")){ t.classList.add("armed","danger"); t.textContent="Ganti data sekarang?"; setTimeout(()=>{ if(t.isConnected){ t.classList.remove("armed","danger"); t.textContent="Pulihkan"; } },4000); return; }
    try{ const text=await IDB.req("snapdata","readonly",s=>s.get(+t.dataset.id)); const parsed=Backup.parse(text); const n=await Backup.restore(parsed,true); toast("Data dipulihkan ke salinan ini — "+n+" dokumen"); Panel.render(); }
    catch(err){ toast("Pemulihan gagal: "+(err&&err.message||""),true); }
    return; }
  if(a==="new"){ S.draft=newDraft(); go("form"); }
  else if(a==="open"){ go("detail",t.dataset.id); }
  else if(a==="back"){ go("list"); }
  else if(a==="cancel"){ const id=S.draft&&S.draft.id; S.draft=null; id?go("detail",id):go("list"); }
  else if(a==="fj"){ S.fj=t.dataset.v; rerenderList(); }
  else if(a==="fs"){ S.fs = S.fs===t.dataset.v?"semua":t.dataset.v; rerenderList(); }
  else if(a==="csv"){ exportCSV(); }
  else if(a==="jenis"){ e.preventDefault(); const d=S.draft; if(d.jenis===t.dataset.v) return; const prevIT = itSide(d.jenis); d.jenis=t.dataset.v; const newIT=itSide(d.jenis);
      if(prevIT!==newIT){ const tmp=d.p1; d.p1=d.p2; d.p2=tmp; const ts=d.ttd.p1; d.ttd.p1=d.ttd.p2; d.ttd.p2=ts; }
      applyPetugas(d,petugas()); render(); }
  else if(a==="addItem"){ S.draft.items.push(newItem()); S.draft._dirty=true; renderItems(); const n=S.draft.items.length-1; const el=document.getElementById(`it${n}_nama`); if(el) el.focus(); }
  else if(a==="rmItem"){ S.draft.items.splice(+t.dataset.i,1); S.draft._dirty=true; renderItems(); }
  else if(a==="rmPhoto"){ S.draft.photos.splice(+t.dataset.i,1); S.draft._dirty=true; $("#photos").innerHTML=photosHTML(S.draft); }
  else if(a==="sign"){ e.preventDefault(); const k=t.dataset.k, d=S.draft; openPad(JENIS[d.jenis][k], d[k].nama, url=>{ d.ttd[k]=url; d._sigTouched=Object.assign({},d._sigTouched,{[k]:true}); $("#sigs").innerHTML=sigsHTML(d); }); }
  else if(a==="unsign"){ const k=t.dataset.k; S.draft.ttd[k]=""; $("#sigs").innerHTML=sigsHTML(S.draft); }
  else if(a==="signDoc"){ const r=S.records.find(x=>x.id===S.currentId); if(!r) return; const k=t.dataset.k;
      openPad(JENIS[r.jenis][k], r[k].nama, async url=>{ Backup.regrant(); const rec=JSON.parse(JSON.stringify(r)); rec.ttd=Object.assign({p1:"",p2:""},rec.ttd,{[k]:url}); rec.updatedAt=Date.now(); if(rec.ttd.p1&&rec.ttd.p2) rec.ttdAt=Date.now();
        try{ await Store.save(rec); toast(statusOf(rec)==="selesai"?"Lengkap — dokumen diterima":"Tanda tangan disimpan"); if(Store.mode==="db"){ const i=S.records.findIndex(x=>x.id===rec.id); if(i>-1){S.records[i]=rec;} render(); } }catch(err){ toast("Gagal menyimpan tanda tangan: "+(err.message||""),true); } }); }
  else if(a==="edit"){ const r=S.records.find(x=>x.id===S.currentId); if(!r) return; const d=normDraft(JSON.parse(JSON.stringify(r))); d._hadSig=!!(d.ttd.p1||d.ttd.p2); d._dirty=false; S.draft=d; go("form"); }
  else if(a==="del"){ if(!t.classList.contains("armed")){ t.classList.add("armed"); t.textContent="Yakin hapus?"; setTimeout(()=>{ if(t.isConnected){t.classList.remove("armed");t.textContent="Hapus"} },4000); return; }
      const r=S.records.find(x=>x.id===S.currentId); if(!r) return; try{ await Store.remove(r); toast("Dokumen "+r.no+" dihapus"); go("list"); }catch(err){ toast("Gagal menghapus: "+(err.message||""),true); } }
  else if(a==="print"){ try{ window.print(); }catch(err){ toast("Cetak tidak tersedia di sini — gunakan Unduh PDF",true); } }
  else if(a==="pdf"){ const r=S.records.find(x=>x.id===S.currentId); if(r) makePDF(r); }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){ S.q=t.value; const l=$("#list"); if(l){ const rows=filtered(); l.innerHTML=rows.length?rows.map(rowHTML).join(""):emptyHTML(); } return; }
  if(!S.draft) return;
  if(t.dataset.b){ setPath(S.draft,t.dataset.b,t.value); S.draft._dirty=true; if(/^p[12]\.nama$/.test(t.dataset.b)){ const s=$("#sigs"); if(s) s.innerHTML=sigsHTML(S.draft); } }
  else if(t.dataset.it!==undefined){ S.draft.items[+t.dataset.it][t.dataset.f]=t.value; S.draft._dirty=true; }
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.tagName==="SELECT" && S.draft){ if(t.dataset.b) setPath(S.draft,t.dataset.b,t.value); else if(t.dataset.it!==undefined) S.draft.items[+t.dataset.it][t.dataset.f]=t.value; S.draft._dirty=true; }
  if(t.id==="bkMode"){ Backup.meta.mode=t.value; Backup.saveMeta(); renderChip(); if(t.value!=="off") Backup.run(); return; }
  if(t.id==="bkFileIn" && t.files[0]){
    const f=t.files[0]; try{ const parsed=Backup.parse(await f.text()); parsed.name=f.name; Panel.pending=parsed; Panel.render(); }catch(err){ toast(err.message,true); } return; }
  if(t.id==="photoIn" && S.draft){
    const files=[...t.files].slice(0,MAX_PHOTOS-S.draft.photos.length); if(!files.length) return;
    await ready; const box=$("#photos"); box.insertAdjacentHTML("beforeend",`<span class="lock" id="upl">Mengunggah ${files.length} foto…</span>`);
    for(const f of files){ try{ S.draft.photos.push(await Store.addPhoto(f)); S.draft._dirty=true; }catch(err){ toast("Foto gagal ditambahkan: "+(err.message||""),true); } }
    if($("#photos")) $("#photos").innerHTML=photosHTML(S.draft);
  }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && Panel.open) Panel.close(); });
document.addEventListener("click",e=>{ if(e.target && e.target.id==="bkOv") Panel.close(); });
document.addEventListener("submit",e=>{ if(e.target.id==="frm"){ e.preventDefault(); submitForm(); } });
function rerenderList(){ const cur=$("#q"); const pos=cur&&cur.selectionStart; render(); const q=$("#q"); if(cur&&document.activeElement!==q&&pos!=null){} }
function renderItems(){
  const box=$("#items"); if(!box) return;
  const tail=box.querySelectorAll(":scope > div:not(.item)");
  box.querySelectorAll(".item").forEach(n=>n.remove());
  const html=S.draft.items.map((it,i)=>itemHTML(it,i,S.draft.items.length)).join("");
  tail[0].insertAdjacentHTML("beforebegin",html);
}

/* ---------- boot ---------- */
let ready;
{const h=document.getElementById("hdrLogo"); if(h) h.src=LOGO;}
function start(saved){
  if(saved && saved.view){ S.view=saved.view; S.draft=saved.draft||null; S.currentId=saved.currentId||null; if(S.view==="form"&&!S.draft) S.view="list"; }
  try{ window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(()=>({view:S.view,draft:S.draft,currentId:S.currentId})); }catch(e){}
  render();
  Backup.init();
  ready = Store.init().catch(()=>{ Store.mode="local"; setSync(); S.records=lsGet(LS_KEY,[]); S.loaded=true; onData(); });
}
try{
  const hot=window.claude&&window.claude.hot;
  if(hot && hot.ready) hot.ready(start); else start((hot&&hot.data)||{});
}catch(e){ start({}); }
})();
</script>
